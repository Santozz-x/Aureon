services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aureon
      POSTGRES_PASSWORD: aureon
      POSTGRES_DB: aureon
    ports:
      - "5432:5432"
    volumes:
      - aureon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureon"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  aureon-postgres-data:
