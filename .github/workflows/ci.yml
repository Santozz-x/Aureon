name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aureon
          POSTGRES_PASSWORD: aureon
          POSTGRES_DB: aureon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aureon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: go work sync
        run: go work sync

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://aureon:aureon@localhost:5432/aureon?sslmode=disable
        run: make test

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Lint
        run: make lint

      - name: gofmt check
        run: |
          diff <(gofmt -s -l .) <(printf '')
